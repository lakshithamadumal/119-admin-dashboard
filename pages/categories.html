<div class="row gy-6">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <h4 class="mb-1">Emergency Categories</h4>
        <p class="text-body-secondary mb-0">Manage emergency report categories.</p>
      </div>
      <button class="btn btn-primary btn-sm" type="button" onclick="openAddCategoryModal()">Add Category</button>
    </div>
  </div>

  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
        <h5 class="mb-0">Categories List</h5>
        <input type="text" class="form-control" placeholder="Search categories..." style="width: 220px;">
      </div>
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Category ID</th>
              <th>Name</th>
              <th>Category Icon</th>
              <th>Total Reports</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categories-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Category Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1" role="dialog" aria-labelledby="categoryModalTitle" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="categoryModalTitle">Add Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Category Name</label>
          <input type="text" class="form-control" id="modal-category-name" placeholder="Enter category name">
        </div>
        <div class="mb-3">
          <label class="form-label">Category Icon</label>
          <input type="file" class="form-control" id="modal-category-icon" accept="image/*">
          <div class="form-text">Upload an image for this category icon.</div>
          <div class="mt-3 d-none" id="modal-category-icon-preview-wrap">
            <img id="modal-category-icon-preview" src="" alt="Category icon preview" class="rounded border" style="width: 64px; height: 64px; object-fit: cover;">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="saveCategoryModal()">Save Category</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmTitle" aria-hidden="true">
  <div class="modal-dialog modal-sm" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteConfirmTitle">Delete Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="delete-confirm-message">Are you sure you want to delete this category?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteCategory()">Delete</button>
      </div>
    </div>
  </div>
</div>
