<!doctype html>
<html lang="en" class="layout-menu-fixed layout-compact" data-assets-path="assets/" data-template="vertical-menu-template-free">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SOS Details - 119</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&ampdisplay=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/vendor/fonts/iconify-icons.css">
    <link rel="stylesheet" href="assets/vendor/libs/node-waves/node-waves.css">
    <link rel="stylesheet" href="assets/vendor/css/core.css">
    <link rel="stylesheet" href="assets/css/demo.css">
    <link rel="stylesheet" href="assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css">
    <script src="assets/vendor/js/helpers.js"></script>
    <script src="assets/js/config.js"></script>
  </head>
  <body>
    <div class="layout-wrapper layout-content-navbar">
      <div class="layout-container">
        <div class="layout-page">
          <div class="content-wrapper">
            <div class="container-xxl flex-grow-1 container-p-y">

              <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
                <div>
                  <h4 class="mb-1">SOS Request Details</h4>
                  <p class="text-body-secondary mb-0">Full SOS incident record with user, medical, and membership context.</p>
                </div>
                <div class="btn-group">
                  <button class="btn btn-secondary btn-sm" onclick="window.location.href='index.html'">
                    <i class="ri ri-arrow-left-line me-1"></i>Back to Dashboard
                  </button>
                </div>
              </div>

              <div id="sos-details-content">

                <!-- SOS Incident Summary -->
                <div class="card mb-4">
                  <div class="card-header d-flex align-items-center justify-content-between">
                    <h5 class="mb-0">
                      <span class="badge bg-danger me-2">SOS</span>Incident Summary
                    </h5>
                    <div class="d-flex gap-2">
                      <button class="btn btn-sm btn-primary" id="sos-detail-view-map" type="button">
                        <i class="ri ri-map-pin-line me-1"></i>View on Map
                      </button>
                      <button class="btn btn-sm btn-outline-primary" id="sos-detail-copy-location" type="button">
                        <i class="ri ri-map-2-line me-1"></i>Get Location
                      </button>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="row">
                      <div class="col-md-4 mb-3">
                        <label class="form-label small text-muted">SOS ID</label>
                        <input class="form-control form-control-sm" id="sos-detail-id" readonly>
                      </div>
                      <div class="col-md-4 mb-3">
                        <label class="form-label small text-muted">Category</label>
                        <input class="form-control form-control-sm" id="sos-detail-category" readonly>
                      </div>
                      <div class="col-md-4 mb-3">
                        <label class="form-label small text-muted">Priority</label>
                        <div>
                          <span class="badge bg-label-secondary fs-6 px-3 py-2" id="sos-detail-priority">-</span>
                        </div>
                      </div>
                      <div class="col-md-4 mb-3">
                        <label class="form-label small text-muted">Status</label>
                        <div>
                          <span class="badge fs-6 px-3 py-2" id="sos-detail-status-badge">-</span>
                        </div>
                      </div>
                      <div class="col-md-4 mb-3">
                        <label class="form-label small text-muted">Latitude</label>
                        <input class="form-control form-control-sm" id="sos-detail-latitude" readonly>
                      </div>
                      <div class="col-md-4 mb-3">
                        <label class="form-label small text-muted">Longitude</label>
                        <input class="form-control form-control-sm" id="sos-detail-longitude" readonly>
                      </div>
                      <div class="col-md-6 mb-3">
                        <label class="form-label small text-muted">Created Date</label>
                        <input class="form-control form-control-sm" id="sos-detail-created" readonly>
                      </div>
                      <div class="col-md-6 mb-3">
                        <label class="form-label small text-muted">Update Status</label>
                        <div class="d-flex gap-2">
                          <select class="form-select form-select-sm" id="sos-status-select">
                            <option value="Active">Active</option>
                            <option value="Resolved">Resolved</option>
                          </select>
                          <button class="btn btn-sm btn-primary" id="sos-save-status" type="button">Save</button>
                        </div>
                        <small class="text-success mt-1 d-none" id="sos-status-feedback">Status updated.</small>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- User + Medical -->
                <div class="row">
                  <div class="col-lg-6 mb-4">
                    <div class="card h-100">
                      <div class="card-header">
                        <h6 class="mb-0"><i class="ri ri-user-line me-1"></i>User Account Details</h6>
                      </div>
                      <div class="card-body">
                        <div class="mb-3">
                          <label class="form-label small text-muted">User ID</label>
                          <input class="form-control form-control-sm" id="sos-detail-user-id" readonly>
                        </div>
                        <div class="mb-3">
                          <label class="form-label small text-muted">Name</label>
                          <input class="form-control form-control-sm" id="sos-detail-user-name" readonly>
                        </div>
                        <div class="mb-3">
                          <label class="form-label small text-muted">Email</label>
                          <input class="form-control form-control-sm" id="sos-detail-user-email" readonly>
                        </div>
                        <div class="mb-3">
                          <label class="form-label small text-muted">Phone</label>
                          <input class="form-control form-control-sm" id="sos-detail-user-phone" readonly>
                        </div>
                        <div class="mb-0">
                          <label class="form-label small text-muted">Registered Date</label>
                          <input class="form-control form-control-sm" id="sos-detail-user-registered" readonly>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-lg-6 mb-4">
                    <div class="card h-100">
                      <div class="card-header">
                        <h6 class="mb-0"><i class="ri ri-heart-pulse-line me-1"></i>Medical Information</h6>
                      </div>
                      <div class="card-body">
                        <div class="mb-3">
                          <label class="form-label small text-muted">Blood Group</label>
                          <input class="form-control form-control-sm" id="sos-detail-medical-blood" readonly>
                        </div>
                        <div class="mb-3">
                          <label class="form-label small text-muted">Allergies</label>
                          <input class="form-control form-control-sm" id="sos-detail-medical-allergies" readonly>
                        </div>
                        <div class="mb-3">
                          <label class="form-label small text-muted">Medical Conditions</label>
                          <input class="form-control form-control-sm" id="sos-detail-medical-conditions" readonly>
                        </div>
                        <div class="mb-0">
                          <label class="form-label small text-muted">Emergency Contact</label>
                          <input class="form-control form-control-sm" id="sos-detail-medical-contact" readonly>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Membership + Payment -->
                <div class="row">
                  <div class="col-lg-6 mb-4">
                    <div class="card h-100">
                      <div class="card-header">
                        <h6 class="mb-0"><i class="ri ri-shield-user-line me-1"></i>Membership Information</h6>
                      </div>
                      <div class="card-body">
                        <div class="mb-3">
                          <label class="form-label small text-muted">Plan Name</label>
                          <input class="form-control form-control-sm" id="sos-detail-membership-plan" readonly>
                        </div>
                        <div class="mb-3">
                          <label class="form-label small text-muted">Membership Status</label>
                          <input class="form-control form-control-sm" id="sos-detail-membership-status" readonly>
                        </div>
                        <div class="mb-3">
                          <label class="form-label small text-muted">Start Date</label>
                          <input class="form-control form-control-sm" id="sos-detail-membership-start" readonly>
                        </div>
                        <div class="mb-0">
                          <label class="form-label small text-muted">Expire Date</label>
                          <input class="form-control form-control-sm" id="sos-detail-membership-expire" readonly>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="col-lg-6 mb-4">
                    <div class="card h-100">
                      <div class="card-header">
                        <h6 class="mb-0"><i class="ri ri-bank-card-line me-1"></i>Payment Information</h6>
                      </div>
                      <div class="card-body">
                        <div class="mb-3">
                          <label class="form-label small text-muted">Payment ID</label>
                          <input class="form-control form-control-sm" id="sos-detail-payment-id" readonly>
                        </div>
                        <div class="mb-3">
                          <label class="form-label small text-muted">Transaction ID</label>
                          <input class="form-control form-control-sm" id="sos-detail-payment-transaction" readonly>
                        </div>
                        <div class="mb-3">
                          <label class="form-label small text-muted">Amount</label>
                          <input class="form-control form-control-sm" id="sos-detail-payment-amount" readonly>
                        </div>
                        <div class="mb-3">
                          <label class="form-label small text-muted">Currency</label>
                          <input class="form-control form-control-sm" id="sos-detail-payment-currency" readonly>
                        </div>
                        <div class="mb-0">
                          <label class="form-label small text-muted">Payment Status</label>
                          <input class="form-control form-control-sm" id="sos-detail-payment-status" readonly>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

              </div><!-- /sos-details-content -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/vendor/libs/jquery/jquery.js"></script>
    <script src="assets/vendor/libs/popper/popper.js"></script>
    <script src="assets/vendor/js/bootstrap.js"></script>
    <script src="js/app.js"></script>
    <script>
      const sosId = new URLSearchParams(window.location.search).get('sosId');
      if (sosId) {
        renderSosDetailsPage(parseInt(sosId, 10));
      }
    </script>
  </body>
</html>
