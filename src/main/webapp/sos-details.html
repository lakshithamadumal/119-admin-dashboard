<!doctype html>
<html
    lang="en"
    class="layout-menu-fixed layout-compact"
    data-assets-path="assets/"
    data-template="vertical-menu-template-free"
>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
        <title>SOS Details - 119</title>
        <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&ampdisplay=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/vendor/fonts/iconify-icons.css">
        <link rel="stylesheet" href="assets/vendor/libs/node-waves/node-waves.css">
        <link rel="stylesheet" href="assets/vendor/css/core.css">
        <link rel="stylesheet" href="assets/css/demo.css">
        <link rel="stylesheet" href="assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css">
        <script src="assets/vendor/js/helpers.js"></script>
        <script src="assets/js/config.js"></script>
    </head>
    <body>
        <div class="layout-wrapper layout-content-navbar">
            <div class="layout-container">
                <div class="layout-page">
                    <div class="content-wrapper">
                        <div class="container-xxl grow container-p-y">
                            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
                                <div>
                                    <h4 class="mb-1">SOS Request Details</h4>
                                    <p class="text-body-secondary mb-0">Full SOS incident record with user, medical, and membership context.</p>
                                </div>
                                <div class="btn-group">
                                    <button class="btn btn-secondary btn-sm" onclick="window.location.href='index.html'">
                                        <i class="ri ri-arrow-left-line me-1"></i>
                                        Back to Dashboard
                                    </button>
                                </div>
                            </div>
                            <div id="sos-details-content">
                                <!-- SOS Incident Summary -->
                                <div class="card mb-4">
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-4 mb-3">
                                                <label class="form-label small text-muted">SOS ID</label>
                                                <input class="form-control form-control-sm" id="sos-detail-id" readonly>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label small text-muted">Created Date</label>
                                                <input class="form-control form-control-sm" id="sos-detail-created" readonly>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- User + Medical -->
                                <div class="row">
                                    <div class="col-lg-6 mb-4">
                                        <div class="card h-100">
                                            <div class="card-header">
                                                <h6 class="mb-0">User Account Details</h6>
                                            </div>
                                            <div class="card-body">
                                                <div class="mb-3">
                                                    <label class="form-label small text-muted">Name</label>
                                                    <input class="form-control form-control-sm" id="detail-user-name" readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label small text-muted">Email</label>
                                                    <input class="form-control form-control-sm" id="detail-user-email" readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label small text-muted">Phone</label>
                                                    <input class="form-control form-control-sm" id="detail-user-phone" readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label small text-muted">Registered Date</label>
                                                    <input class="form-control form-control-sm" id="detail-user-registered" readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label small text-muted">Address</label>
                                                    <input class="form-control form-control-sm" id="detail-user-address" readonly>
                                                </div>
                                                <div class="mb-0">
                                                    <label class="form-label small text-muted">NIC</label>
                                                    <input class="form-control form-control-sm" id="detail-user-nic" readonly>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-6 mb-4">
                                        <div class="card h-100">
                                            <div class="card-header">
                                                <h6 class="mb-0">Medical Information</h6>
                                            </div>
                                            <div class="card-body">
                                                <div class="mb-3">
                                                    <label class="form-label small text-muted">Blood Group</label>
                                                    <input class="form-control form-control-sm" id="detail-medical-blood" readonly>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label small text-muted">Allergies</label>
                                                    <textarea
                                                        class="form-control form-control-sm"
                                                        id="detail-medical-allergies"
                                                        rows="2"
                                                        readonly
                                                    ></textarea>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label small text-muted">Medical Conditions</label>
                                                    <textarea
                                                        class="form-control form-control-sm"
                                                        id="detail-medical-conditions"
                                                        rows="2"
                                                        readonly
                                                    ></textarea>
                                                </div>
                                                <div class="mb-0">
                                                    <label class="form-label small text-muted">Current Medications</label>
                                                    <textarea
                                                        class="form-control form-control-sm"
                                                        id="detail-medical-medications"
                                                        rows="2"
                                                        readonly
                                                    ></textarea>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <!-- Subscription -->
                                    <div class="col-lg-6 mb-4">
                                        <div class="card">
                                            <div class="card-header">
                                                <h6 class="mb-0">Subscription</h6>
                                            </div>
                                            <div class="card-body">
                                                <div class="row">
                                                    <div class="col-md-12 mb-3">
                                                        <label class="form-label small text-muted">Payment Status</label>
                                                        <input class="form-control form-control-sm" id="detail-subscription-status" readonly>
                                                    </div>
                                                    <div class="col-md-12 mb-3">
                                                        <label class="form-label small text-muted">Expiry Date</label>
                                                        <input class="form-control form-control-sm" id="detail-subscription-expiry" readonly>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Contact Info -->
                                    <div class="col-lg-6 mb-4">
                                        <div class="card">
                                            <div class="card-header">
                                                <h6 class="mb-0">Contact Info</h6>
                                            </div>
                                            <div class="card-body">
                                                <div class="row">
                                                    <div class="col-md-6 mb-3">
                                                        <label class="form-label small text-muted">Emergency Contact 1 Name</label>
                                                        <input class="form-control form-control-sm" id="detail-ec1-name" readonly>
                                                    </div>
                                                    <div class="col-md-6 mb-3">
                                                        <label class="form-label small text-muted">Emergency Contact 1 Number</label>
                                                        <input class="form-control form-control-sm" id="detail-ec1-phone" readonly>
                                                    </div>
                                                    <div class="col-md-6 mb-3">
                                                        <label class="form-label small text-muted">Emergency Contact 2 Name</label>
                                                        <input class="form-control form-control-sm" id="detail-ec2-name" readonly>
                                                    </div>
                                                    <div class="col-md-6 mb-3">
                                                        <label class="form-label small text-muted">Emergency Contact 2 Number</label>
                                                        <input class="form-control form-control-sm" id="detail-ec2-phone" readonly>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card mb-4">
                                    <div class="card-header">
                                        <h6 class="mb-0">Media Attachments</h6>
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-4 mb-3">
                                                <label class="form-label small text-muted">Image</label>
                                                <div class="border rounded p-2 text-body-secondary" id="detail-media-image"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- /sos-details-content -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="assets/vendor/libs/jquery/jquery.js"></script>
        <script src="assets/vendor/libs/popper/popper.js"></script>
        <script src="assets/vendor/js/bootstrap.js"></script>
                <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
                <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
                <script src="js/firebase-config.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/data.js"></script>
        <script src="js/sos-details.js"></script>
        <script>
      const sosId = new URLSearchParams(window.location.search).get('sosId');
            if (sosId && sosId.trim()) {
                renderSosDetailsPage(sosId.trim());
            } else {
                const detailsContent = document.getElementById('sos-details-content');
                if (detailsContent) {
                    detailsContent.innerHTML = '<div class="alert alert-warning">Missing SOS id. Please open this page from the SOS list.</div>';
                }
      }
        </script>
    </body>
</html>
