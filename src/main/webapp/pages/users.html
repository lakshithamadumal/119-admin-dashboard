<div class="row gy-6">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <h4 class="mb-1">Users & Memberships</h4>
        <p class="text-body-secondary mb-0">View and manage registered users with membership information.</p>
      </div>
    </div>
  </div>

  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
        <h5 class="mb-0">User Directory</h5>
        <input type="text" class="form-control" placeholder="Search users..." style="width: 220px;">
      </div>
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>User ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Membership Status</th>
              <th>Created Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- User Details Modal -->
<div class="modal fade" id="userDetailsModal" tabindex="-1" role="dialog" aria-labelledby="userDetailsModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="userDetailsModalTitle">User Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
<div class="modal-body">

  <!-- Account Information -->
  <div class="card mb-3">
    <div class="card-header">
      <h6 class="mb-0">Account Information</h6>
    </div>

    <div class="card-body">
      <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">User ID</label>
          <input class="form-control form-control-sm" id="modal-user-id" readonly>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Full Name</label>
          <input class="form-control form-control-sm" id="modal-user-name" readonly>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Email</label>
          <input class="form-control form-control-sm" id="modal-user-email" readonly>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Phone</label>
          <input class="form-control form-control-sm" id="modal-user-phone" readonly>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">NIC</label>
          <input class="form-control form-control-sm" id="modal-user-nic" readonly>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Registered Date</label>
          <input class="form-control form-control-sm" id="modal-user-registered" readonly>
        </div>

        <div class="col-md-12 mb-0">
          <label class="form-label small text-muted">Address</label>
          <input class="form-control form-control-sm" id="modal-user-address" readonly>
        </div>

      </div>
    </div>
  </div>


  <!-- Medical Information -->
  <div class="card mb-3">
    <div class="card-header">
      <h6 class="mb-0">Medical Information</h6>
    </div>

    <div class="card-body">
      <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Blood Group</label>
          <input class="form-control form-control-sm" id="modal-medical-blood" readonly>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Allergies</label>
          <textarea class="form-control form-control-sm" id="modal-medical-allergies" rows="2" readonly></textarea>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Medical Conditions</label>
          <textarea class="form-control form-control-sm" id="modal-medical-conditions" rows="2" readonly></textarea>
        </div>

        <div class="col-md-6 mb-0">
          <label class="form-label small text-muted">Current Medications</label>
          <textarea class="form-control form-control-sm" id="modal-medical-medications" rows="2" readonly></textarea>
        </div>

      </div>
    </div>
  </div>


  <!-- Subscription -->
  <div class="card mb-3">
    <div class="card-header">
      <h6 class="mb-0">Subscription</h6>
    </div>

    <div class="card-body">
      <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Payment Status</label>
          <input class="form-control form-control-sm" id="modal-subscription-status" readonly>
        </div>

        <div class="col-md-6 mb-0">
          <label class="form-label small text-muted">Expiry Date</label>
          <input class="form-control form-control-sm" id="modal-subscription-expiry" readonly>
        </div>

      </div>
    </div>
  </div>


  <!-- Emergency Contacts -->
  <div class="card mb-3">
    <div class="card-header">
      <h6 class="mb-0">Emergency Contacts</h6>
    </div>

    <div class="card-body">
      <div class="row">

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Emergency Contact 1 Name</label>
          <input class="form-control form-control-sm" id="modal-ec1-name" readonly>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Emergency Contact 1 Number</label>
          <input class="form-control form-control-sm" id="modal-ec1-phone" readonly>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label small text-muted">Emergency Contact 2 Name</label>
          <input class="form-control form-control-sm" id="modal-ec2-name" readonly>
        </div>

        <div class="col-md-6 mb-0">
          <label class="form-label small text-muted">Emergency Contact 2 Number</label>
          <input class="form-control form-control-sm" id="modal-ec2-phone" readonly>
        </div>

      </div>
    </div>
  </div>


  <!-- Media Attachments -->
  <div class="card mb-3">
    <div class="card-header">
      <h6 class="mb-0">Media Attachments</h6>
    </div>

    <div class="card-body">

      <label class="form-label small text-muted">Image</label>

      <div class="border rounded p-2 text-body-secondary" id="modal-media-image">
        No image uploaded
      </div>

    </div>
  </div>
</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
