<div class="row gy-6">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <h4 class="mb-1">SOS Requests</h4>
        <p class="text-body-secondary mb-0">Instant SOS alerts sent by users requiring immediate response.</p>
      </div>
    </div>
  </div>

  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
        <h5 class="mb-0">SOS Alerts</h5>
        <div class="d-flex gap-2">
          <input type="text" class="form-control" id="sos-search" placeholder="Search SOS..." style="width: 220px;">
          <select class="form-select" id="sos-status-filter" style="width: 160px;">
            <option value="">All Status</option>
            <option value="Active">Active</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>SOS ID</th>
              <th>Name</th>
              <th>Contact</th>
              <th>Created Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="sos-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
