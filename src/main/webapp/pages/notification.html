<div class="row gy-6">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <h4 class="mb-1">Notifications</h4>
        <p class="text-body-secondary mb-0">Send platform-wide or user-specific notifications and review delivery history.</p>
      </div>
    </div>
  </div>

  <div class="col-12">
    <div class="card">
      <div class="card-header">
        <h5 class="mb-0">Notification Form</h5>
      </div>
      <div class="card-body">
        <div class="row g-4">
          <div class="col-md-6">
            <label for="notification-title" class="form-label">Title</label>
            <input type="text" class="form-control" id="notification-title" placeholder="Enter notification title">
          </div>

          <div class="col-12">
            <label for="notification-description" class="form-label">Description</label>
            <textarea class="form-control" id="notification-description" rows="4" placeholder="Enter notification description"></textarea>
          </div>

          <div class="col-12">
            <label class="form-label d-block">Type</label>
            <div class="d-flex flex-wrap gap-4" id="notification-type-group">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="notification-type" id="notification-type-system" value="SYSTEM" checked>
                <label class="form-check-label" for="notification-type-system">SYSTEM</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="notification-type" id="notification-type-promo" value="PROMO">
                <label class="form-check-label" for="notification-type-promo">PROMO</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="notification-type" id="notification-type-sos" value="SOS">
                <label class="form-check-label" for="notification-type-sos">SOS</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="notification-type" id="notification-type-report" value="REPORT">
                <label class="form-check-label" for="notification-type-report">REPORT</label>
              </div>
            </div>
          </div>

          <div class="col-12 d-flex justify-content-end">
            <button type="button" class="btn btn-primary" id="notification-send-btn">Send</button>
          </div>

          <div class="col-12">
            <div class="alert alert-success d-none mb-0" id="notification-feedback" role="alert">
              Notification sent successfully.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12">
    <div class="card">
      <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
        <h5 class="mb-0">Notification History</h5>
        <div class="d-flex flex-wrap gap-2">
          <input type="text" class="form-control" id="notification-user-search" placeholder="Search by user ID..." style="width: 220px;">
          <select class="form-select" id="notification-user-filter" style="width: 220px;">
            <option value="">All User IDs</option>
          </select>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>User ID</th>
              <th>Title</th>
              <th>Type</th>
              <th>Description</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody id="notifications-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
