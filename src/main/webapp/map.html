<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map - 119</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
      }

      html, body {
        height: 100%;
        margin: 0;
        font-family: "Inter", sans-serif;
        background: #f5f5f9;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .map-header {
        padding: 12px 18px;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .map-header h1 {
        font-size: 16px;
        margin: 0;
      }

      .map-header small {
        color: #6b7280;
      }

      .map-actions {
        display: flex;
        gap: 8px;
      }

      .map-actions a {
        text-decoration: none;
        color: #696cff;
        font-weight: 600;
      }

      #map {
        flex: 1;
        width: 100%;
      }

      .mapboxgl-popup {
        max-width: 240px;
        font-family: "Inter", sans-serif;
      }

      .mapboxgl-popup-content {
        padding: 12px 12px 10px;
        border-radius: 10px;
      }

      .mapboxgl-popup-content h3 {
        margin: 0 0 6px;
        font-size: 14px;
      }

      .mapboxgl-popup-content p {
        margin: 0 0 6px;
        color: #4b5563;
        font-size: 12px;
      }

      .mapboxgl-popup-content a {
        display: inline-block;
        margin-top: 6px;
        padding: 6px 10px;
        background: #696cff;
        color: #ffffff;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 12px;
      }

      .status-marker {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .status-marker.focused {
        width: 20px;
        height: 20px;
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
        animation: focusPulse 1.5s ease-out infinite;
      }

      @keyframes focusPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
        }
        70% {
          box-shadow: 0 0 0 18px rgba(239, 68, 68, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
      }

      .info-window {
        font-size: 13px;
        color: #111827;
      }

      .info-window h3 {
        margin: 0 0 6px;
        font-size: 14px;
      }

      .info-window p {
        margin: 0 0 6px;
        color: #4b5563;
      }

      .info-window a {
        display: inline-block;
        margin-top: 6px;
        padding: 6px 10px;
        background: #696cff;
        color: #ffffff;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header class="map-header">
      <div>
        <h1>Live Emergency Map</h1>
        <small>Real-time report monitoring</small>
      </div>
      <div class="map-actions">
        <a href="index.html" rel="noopener">Back to Dashboard</a>
      </div>
    </header>
    <div id="map"></div>

    <script src="js/utils.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script>
      mapboxgl.accessToken = 'pk.eyJ1IjoibGFreTIwMDMiLCJhIjoiY21sbmdpdXE4MHNsdDNlcHVkb2FtYWQ0ZiJ9.Nj48QIGZ9wSy8Zuw7NEUjQ';

      const defaultCenter = [80.7718, 7.8731];
      const defaultZoom = 7;
      const priorityColors = {
        critical: '#b91c1c',
        high: '#ef4444',
        medium: '#f59e0b',
        low: '#22c55e',
        info: '#0ea5e9'
      };

      function normalizeSeverity(value) {
        if (value === null || value === undefined) {
          return 'low';
        }
        return String(value).trim().toLowerCase();
      }

      function getSeverityColor(value) {
        const normalized = normalizeSeverity(value);
        return priorityColors[normalized] || '#6b7280';
      }

      function parseCoordinate(value, min, max) {
        if (typeof value === 'object') {
          const geo = readGeoPointLike(value);
          if (geo) {
            return parseCoordinate(min === -90 ? geo.latitude : geo.longitude, min, max);
          }
          return null;
        }

        if (value === null || value === undefined) {
          return null;
        }

        const trimmed = String(value).trim();
        if (!trimmed) {
          return null;
        }

        const numeric = Number.parseFloat(trimmed);
        if (!Number.isFinite(numeric) || numeric < min || numeric > max) {
          return null;
        }

        return numeric;
      }

      function readGeoPointLike(value) {
        if (!value || typeof value !== 'object') {
          return null;
        }

        const latCandidate = value.latitude ?? value.lat ?? value._lat;
        const lngCandidate = value.longitude ?? value.lng ?? value.lon ?? value._long ?? value._lng;
        if (latCandidate === undefined || lngCandidate === undefined) {
          return null;
        }

        return { latitude: latCandidate, longitude: lngCandidate };
      }

      function getTimestampLabel(timestamp) {
        if (timestamp && typeof timestamp.toDate === 'function') {
          return timestamp.toDate().toLocaleString();
        }

        if (timestamp) {
          const parsed = new Date(timestamp);
          if (!Number.isNaN(parsed.getTime())) {
            return parsed.toLocaleString();
          }
        }

        return '-';
      }

      function getReportCoordinates(report) {
        const locationGeo = readGeoPointLike(report.location) || readGeoPointLike(report.coordinates) || readGeoPointLike(report.geoPoint);
        const latitudeValue = report.latitude ?? report.lat ?? report.geoLat ?? (locationGeo ? locationGeo.latitude : null);
        const longitudeValue = report.longitude ?? report.lng ?? report.geoLng ?? (locationGeo ? locationGeo.longitude : null);

        return {
          latitude: parseCoordinate(latitudeValue, -90, 90),
          longitude: parseCoordinate(longitudeValue, -180, 180)
        };
      }

      function getReportAddress(report) {
        const candidates = [
          report.address,
          report.Address,
          report.location && report.location.address,
          report.locationAddress,
          report.addressText
        ];

        for (const candidate of candidates) {
          if (typeof candidate === 'string' && candidate.trim()) {
            return candidate.trim();
          }
        }

        return '-';
      }

      function buildPopupContent(report) {
        const safeDocId = report.docId ? encodeURIComponent(String(report.docId)) : '';
        const googleMapsUrl = `https://www.google.com/maps?q=${encodeURIComponent(`${report.latitude},${report.longitude}`)}`;
        const locationText = getReportAddress(report);
        const detailsLink = report.source === 'emergency_reports'
          ? (safeDocId ? `<a href="sos-details.html?sosId=${safeDocId}">View SOS</a>` : '')
          : (safeDocId ? `<a href="report-details.html?reportId=${safeDocId}">View Report</a>` : '');
        return `
          <div class="info-window">
            <h3>${escapeHtml(report.reportId || report.docId)}</h3>
            <p><strong>Category:</strong> ${escapeHtml(report.category)}</p>
            <p><strong>Severity:</strong> ${escapeHtml(report.severity)}</p>
            <p><strong>Status:</strong> ${escapeHtml(report.status)}</p>
            <p><strong>Created:</strong> ${escapeHtml(report.createdAt)}</p>
            <p><strong>Location:</strong> ${escapeHtml(locationText)}</p>
            ${detailsLink}
            <a href="${googleMapsUrl}" target="_blank" rel="noopener">Open Google Maps</a>
          </div>
        `;
      }

      async function loadReports() {
        if (typeof db === 'undefined') {
          throw new Error('Firestore is not initialized.');
        }

        const snapshot = await db.collection('reports').get();
        const records = [];

        snapshot.forEach((doc) => {
          const data = doc.data() || {};
          const coordinates = getReportCoordinates(data);
          if (coordinates.latitude === null || coordinates.longitude === null) {
            return;
          }

          records.push({
            docId: doc.id,
            source: 'reports',
            reportId: data.reportId || doc.id,
            category: data.categoryName || data.category || '-',
            severity: data.severity || data.priority || 'Low',
            status: data.status || 'Received',
            createdAt: getTimestampLabel(data.timestamp),
            address: getReportAddress(data),
            latitude: coordinates.latitude,
            longitude: coordinates.longitude
          });
        });

        return records;
      }

      // Removed emergency_reports and fallback logic; only reports collection is used.

      async function initMap() {
        const params = new URLSearchParams(window.location.search);
        const latParam = params.get('lat');
        const lngParam = params.get('lng');
        const reportIdParam = params.get('reportId');
        const sosIdParam = params.get('sosId');
        const priorityParam = params.get('priority');
        const latValue = parseCoordinate(latParam, -90, 90);
        const lngValue = parseCoordinate(lngParam, -180, 180);
        const hasCoordinates = latValue !== null && lngValue !== null;
        const center = [
          hasCoordinates ? lngValue : defaultCenter[0],
          hasCoordinates ? latValue : defaultCenter[1]
        ];

        const map = new mapboxgl.Map({
          container: 'map',
          style: 'mapbox://styles/mapbox/light-v11',
          center,
          zoom: hasCoordinates ? 15 : defaultZoom
        });

        map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

        let reports = [];
        try {
          reports = await loadReports();
        } catch (error) {
          console.error('Unable to load reports from Firestore:', error);
        }

        const bounds = new mapboxgl.LngLatBounds();

        const focusedReport = reportIdParam
          ? reports.find(item => String(item.docId) === String(reportIdParam) || String(item.reportId) === String(reportIdParam))
          : null;
        let focusedMarker = null;

        reports.forEach(report => {
          const markerEl = document.createElement('div');
          markerEl.className = 'status-marker';
          markerEl.style.backgroundColor = getSeverityColor(report.severity);
          if (focusedReport && focusedReport.docId === report.docId) {
            markerEl.classList.add('focused');
          }

          const popup = new mapboxgl.Popup({ offset: 16 }).setHTML(buildPopupContent(report));

          const marker = new mapboxgl.Marker(markerEl)
            .setLngLat([report.longitude, report.latitude])
            .setPopup(popup)
            .addTo(map);

          if (focusedReport && focusedReport.docId === report.docId) {
            focusedMarker = marker;
          }

          bounds.extend([report.longitude, report.latitude]);
        });

        if (!focusedReport && hasCoordinates) {
          const focusEl = document.createElement('div');
          focusEl.className = 'status-marker focused';
          focusEl.style.backgroundColor = getSeverityColor(priorityParam || 'high');
          const contextTitle = reportIdParam
            ? `Report ${escapeHtml(reportIdParam)}`
            : sosIdParam
              ? `SOS ${escapeHtml(sosIdParam)}`
              : 'Selected Location';
          const contextDetailsLink = reportIdParam
            ? `<a href="report-details.html?reportId=${encodeURIComponent(reportIdParam)}">View Report</a>`
            : sosIdParam
              ? `<a href="sos-details.html?sosId=${encodeURIComponent(sosIdParam)}">View SOS</a>`
              : '';
          const contextPopup = new mapboxgl.Popup({ offset: 16 }).setHTML(`
            <div class="info-window">
              <h3>${contextTitle}</h3>
              ${contextDetailsLink}
              <p><strong>Latitude:</strong> ${latValue.toFixed(6)}</p>
              <p><strong>Longitude:</strong> ${lngValue.toFixed(6)}</p>
              <a href="https://www.google.com/maps?q=${encodeURIComponent(`${latValue},${lngValue}`)}" target="_blank" rel="noopener">Open Google Maps</a>
            </div>
          `);
          const contextMarker = new mapboxgl.Marker(focusEl)
            .setLngLat([lngValue, latValue])
            .setPopup(contextPopup)
            .addTo(map);

          const openContextPopup = () => contextMarker.togglePopup();
          if (map.loaded()) {
            openContextPopup();
          } else {
            map.once('load', openContextPopup);
          }
        }

        if (focusedReport && reports.length) {
          map.setCenter([focusedReport.longitude, focusedReport.latitude]);
          map.setZoom(15);
          if (focusedMarker) {
            const openFocusedPopup = () => focusedMarker.togglePopup();
            if (map.loaded()) {
              openFocusedPopup();
            } else {
              map.once('load', openFocusedPopup);
            }
          }
        } else if (hasCoordinates) {
          map.setCenter([lngValue, latValue]);
          map.setZoom(15);
        } else if (reports.length) {
          map.fitBounds(bounds, { padding: 80, maxZoom: 13 });
        } else {
          map.setCenter(defaultCenter);
          map.setZoom(defaultZoom);
        }
      }

      initMap();
    </script>
      <script src="js/firebase-listener.js"></script>
  </body>
</html>
