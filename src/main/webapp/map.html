<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map - 119</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
      }

      html, body {
        height: 100%;
        margin: 0;
        font-family: "Inter", sans-serif;
        background: #f5f5f9;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .map-header {
        padding: 12px 18px;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .map-header h1 {
        font-size: 16px;
        margin: 0;
      }

      .map-header small {
        color: #6b7280;
      }

      .map-actions {
        display: flex;
        gap: 8px;
      }

      .map-actions a {
        text-decoration: none;
        color: #696cff;
        font-weight: 600;
      }

      #map {
        flex: 1;
        width: 100%;
      }

      .mapboxgl-popup {
        max-width: 240px;
        font-family: "Inter", sans-serif;
      }

      .mapboxgl-popup-content {
        padding: 12px 12px 10px;
        border-radius: 10px;
      }

      .mapboxgl-popup-content h3 {
        margin: 0 0 6px;
        font-size: 14px;
      }

      .mapboxgl-popup-content p {
        margin: 0 0 6px;
        color: #4b5563;
        font-size: 12px;
      }

      .mapboxgl-popup-content a {
        display: inline-block;
        margin-top: 6px;
        padding: 6px 10px;
        background: #696cff;
        color: #ffffff;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 12px;
      }

      .status-marker {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .status-marker.focused {
        width: 20px;
        height: 20px;
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
        animation: focusPulse 1.5s ease-out infinite;
      }

      @keyframes focusPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
        }
        70% {
          box-shadow: 0 0 0 18px rgba(239, 68, 68, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
      }

      .info-window {
        font-size: 13px;
        color: #111827;
      }

      .info-window h3 {
        margin: 0 0 6px;
        font-size: 14px;
      }

      .info-window p {
        margin: 0 0 6px;
        color: #4b5563;
      }

      .info-window a {
        display: inline-block;
        margin-top: 6px;
        padding: 6px 10px;
        background: #696cff;
        color: #ffffff;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header class="map-header">
      <div>
        <h1>Live Emergency Map</h1>
        <small>Real-time report monitoring</small>
      </div>
      <div class="map-actions">
        <a href="index.html" rel="noopener">Back to Dashboard</a>
      </div>
    </header>
    <div id="map"></div>

    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script>
      mapboxgl.accessToken = 'pk.eyJ1IjoibGFreTIwMDMiLCJhIjoiY21sbmdpdXE4MHNsdDNlcHVkb2FtYWQ0ZiJ9.Nj48QIGZ9wSy8Zuw7NEUjQ';

      // Load categoriesData and reportsData in js/data.js or replace these mappings with your API payload.
      const categories = categoriesData;
      const reports = reportsData
        .map(report => ({
          id: report.id,
          reportId: report.reportId,
          category_id: report.categoryId,
          priority: report.priority,
          latitude: parseCoordinate(report.latitude, -90, 90),
          longitude: parseCoordinate(report.longitude, -180, 180),
          status: report.status,
          description: report.description,
          created_at: report.createdDate
        }))
        .filter(report => report.latitude !== null && report.longitude !== null);

      const priorityColors = {
        High: '#ef4444',
        Medium: '#f59e0b',
        Low: '#22c55e'
      };

      function getCategoryName(categoryId) {
        const category = categories.find(item => item.id === categoryId);
        return category ? category.name : 'Unknown';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function parseCoordinate(value, min, max) {
        if (value === null || value === undefined) {
          return null;
        }

        const trimmed = String(value).trim();
        if (!trimmed) {
          return null;
        }

        const numeric = Number.parseFloat(trimmed);
        if (!Number.isFinite(numeric) || numeric < min || numeric > max) {
          return null;
        }

        return numeric;
      }

      function initMap() {
        const params = new URLSearchParams(window.location.search);
        const latParam = params.get('lat');
        const lngParam = params.get('lng');
        const reportIdParam = params.get('reportId');
        const sosIdParam = params.get('sosId');
        const priorityParam = params.get('priority');
        const defaultCenter = [80.7718, 7.8731];
        const defaultZoom = 7;
        const latValue = parseCoordinate(latParam, -90, 90);
        const lngValue = parseCoordinate(lngParam, -180, 180);
        const hasCoordinates = latValue !== null && lngValue !== null;
        const center = [
          hasCoordinates ? lngValue : defaultCenter[0],
          hasCoordinates ? latValue : defaultCenter[1]
        ];

        const map = new mapboxgl.Map({
          container: 'map',
          style: 'mapbox://styles/mapbox/light-v11',
          center,
          zoom: hasCoordinates ? 15 : defaultZoom
        });

        map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

        const bounds = new mapboxgl.LngLatBounds();

        const focusedReport = reportIdParam
          ? reports.find(item => String(item.id) === String(reportIdParam) || String(item.reportId) === String(reportIdParam))
          : null;
        let focusedMarker = null;

        reports.forEach(report => {
          const markerEl = document.createElement('div');
          markerEl.className = 'status-marker';
          markerEl.style.backgroundColor = priorityColors[report.priority] || '#6b7280';
          if (focusedReport && focusedReport.id === report.id) {
            markerEl.classList.add('focused');
          }

          const categoryName = getCategoryName(report.category_id);
          const popupContent = `
            <h3>${escapeHtml(report.reportId || `Report #${report.id}`)}</h3>
            <p>Category: ${escapeHtml(categoryName)}</p>
            <p>Priority: ${escapeHtml(report.priority)}</p>
            <p>Status: ${escapeHtml(report.status)}</p>
            <p>Created: ${escapeHtml(report.created_at)}</p>
            <a href="report-details.html?reportId=${report.id}">View Report</a>
          `;

          const popup = new mapboxgl.Popup({ offset: 16 }).setHTML(popupContent);

          const marker = new mapboxgl.Marker(markerEl)
            .setLngLat([report.longitude, report.latitude])
            .setPopup(popup)
            .addTo(map);

          if (focusedReport && focusedReport.id === report.id) {
            focusedMarker = marker;
          }

          bounds.extend([report.longitude, report.latitude]);
        });

        if (!focusedReport && hasCoordinates) {
          const focusEl = document.createElement('div');
          focusEl.className = 'status-marker focused';
          focusEl.style.backgroundColor = priorityColors[priorityParam] || '#ef4444';
          const contextTitle = reportIdParam
            ? `Report ${escapeHtml(reportIdParam)}`
            : sosIdParam
              ? `SOS ${escapeHtml(sosIdParam)}`
              : 'Selected Location';
          const contextPopup = new mapboxgl.Popup({ offset: 16 }).setHTML(`
            <h3>${contextTitle}</h3>
            <p>Latitude: ${latValue.toFixed(6)}</p>
            <p>Longitude: ${lngValue.toFixed(6)}</p>
          `);
          const contextMarker = new mapboxgl.Marker(focusEl)
            .setLngLat([lngValue, latValue])
            .setPopup(contextPopup)
            .addTo(map);

          const openContextPopup = () => contextMarker.togglePopup();
          if (map.loaded()) {
            openContextPopup();
          } else {
            map.once('load', openContextPopup);
          }
        }

        if (focusedReport) {
          map.setCenter([focusedReport.longitude, focusedReport.latitude]);
          map.setZoom(15);
          if (focusedMarker) {
            const openFocusedPopup = () => focusedMarker.togglePopup();
            if (map.loaded()) {
              openFocusedPopup();
            } else {
              map.once('load', openFocusedPopup);
            }
          }
        } else if (hasCoordinates) {
          map.setCenter([lngValue, latValue]);
          map.setZoom(15);
        } else if (reports.length) {
          map.setCenter(defaultCenter);
          map.setZoom(defaultZoom);
        }
      }

      initMap();
    </script>
  </body>
</html>
