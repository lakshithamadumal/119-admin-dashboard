<!doctype html>
<html
    lang="en"
    class="layout-menu-fixed layout-compact"
    data-assets-path="assets/"
    data-template="vertical-menu-template-free"
>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex, nofollow">
        <title>Report Details - 119</title>
        <link rel="icon" type="image/x-icon" href="assets/img/favicon/favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&ampdisplay=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/vendor/fonts/iconify-icons.css">
        <link rel="stylesheet" href="assets/vendor/libs/node-waves/node-waves.css">
        <link rel="stylesheet" href="assets/vendor/css/core.css">
        <link rel="stylesheet" href="assets/css/demo.css">
        <link rel="stylesheet" href="assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css">
        <script src="assets/vendor/js/helpers.js"></script>
        <script src="assets/js/config.js"></script>
    </head>
    <body>
        <div class="layout-wrapper layout-content-navbar">
            <div class="layout-container">
                <div class="layout-page">
                    <div class="content-wrapper">
                        <div class="container-xxl grow container-p-y">
                            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
                                <div>
                                    <h4 class="mb-1">Report Details</h4>
                                    <p class="text-body-secondary mb-0">Full incident record with user, medical, and membership context.</p>
                                </div>
                                <div class="btn-group">
                                    <button class="btn btn-secondary btn-sm" onclick="window.location.href='index.html'">Back to Dashboard</button>
                                </div>
                                <div id="report-details-content">
                                    <div class="card mb-4">
                                        <div class="card-header d-flex align-items-center justify-content-between">
                                            <h5 class="mb-0">Incident Summary</h5>
                                            <div class="d-flex gap-2">
                                                <button class="btn btn-sm btn-primary" id="detail-view-map" type="button" onclick="detailViewMap()">View Live Map</button>
                                                <button class="btn btn-sm btn-outline-primary" id="detail-copy-location" type="button" onclick="detailCopyLocation()">Get Location</button>
                                            </div>
                                        </div>
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col-md-4 mb-3">
                                                    <label class="form-label small text-muted">Report ID</label>
                                                    <input class="form-control form-control-sm" id="detail-report-id" readonly>
                                                </div>
                                                <div class="col-md-4 mb-3">
                                                    <label class="form-label small text-muted">Category</label>
                                                    <input class="form-control form-control-sm" id="detail-report-category" readonly>
                                                </div>
                                                <div class="col-md-4 mb-3">
                                                    <label class="form-label small text-muted">Priority</label>
                                                    <div>
                                                        <span class="badge bg-label-secondary" id="detail-report-priority">-</span>
                                                    </div>
                                                </div>
                                                <div class="col-md-4 mb-3">
                                                    <label class="form-label small text-muted">Status</label>
                                                    <input class="form-control form-control-sm" id="detail-report-status" readonly>
                                                </div>
                                                <div class="col-md-4 mb-3">
                                                    <label class="form-label small text-muted">Latitude</label>
                                                    <input class="form-control form-control-sm" id="detail-report-latitude" readonly>
                                                </div>
                                                <div class="col-md-4 mb-3">
                                                    <label class="form-label small text-muted">Longitude</label>
                                                    <input class="form-control form-control-sm" id="detail-report-longitude" readonly>
                                                </div>
                                                <div class="col-md-4 mb-3">
                                                    <label class="form-label small text-muted">Created Date</label>
                                                    <input class="form-control form-control-sm" id="detail-report-created" readonly>
                                                </div>
                                                <div class="col-md-2 mb-3">
                                                    <label class="form-label small text-muted">Total Reports</label>
                                                    <input class="form-control form-control-sm" id="detail-user-total-reports" readonly>
                                                </div>
                                                <div class="col-md-12">
                                                    <label class="form-label small text-muted">Description</label>
                                                    <textarea
                                                        class="form-control form-control-sm"
                                                        id="detail-report-description"
                                                        rows="3"
                                                        readonly
                                                    ></textarea>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-lg-6 mb-4">
                                            <div class="card h-100">
                                                <div class="card-header">
                                                    <h6 class="mb-0">User Account Details</h6>
                                                </div>
                                                <div class="card-body">
                                                    <div class="mb-3">
                                                        <label class="form-label small text-muted">Name</label>
                                                        <input class="form-control form-control-sm" id="detail-user-name" readonly>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small text-muted">Email</label>
                                                        <input class="form-control form-control-sm" id="detail-user-email" readonly>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small text-muted">Phone</label>
                                                        <input class="form-control form-control-sm" id="detail-user-phone" readonly>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small text-muted">Registered Date</label>
                                                        <input class="form-control form-control-sm" id="detail-user-registered" readonly>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small text-muted">Address</label>
                                                        <input class="form-control form-control-sm" id="detail-user-address" readonly>
                                                    </div>
                                                    <div class="mb-0">
                                                        <label class="form-label small text-muted">NIC</label>
                                                        <input class="form-control form-control-sm" id="detail-user-nic" readonly>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-lg-6 mb-4">
                                            <div class="card h-100">
                                                <div class="card-header">
                                                    <h6 class="mb-0">Medical Information</h6>
                                                </div>
                                                <div class="card-body">
                                                    <div class="mb-3">
                                                        <label class="form-label small text-muted">Blood Group</label>
                                                        <input class="form-control form-control-sm" id="detail-medical-blood" readonly>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small text-muted">Allergies</label>
                                                        <textarea
                                                            class="form-control form-control-sm"
                                                            id="detail-medical-allergies"
                                                            rows="2"
                                                            readonly
                                                        ></textarea>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small text-muted">Medical Conditions</label>
                                                        <textarea
                                                            class="form-control form-control-sm"
                                                            id="detail-medical-conditions"
                                                            rows="2"
                                                            readonly
                                                        ></textarea>
                                                    </div>
                                                    <div class="mb-0">
                                                        <label class="form-label small text-muted">Current Medications</label>
                                                        <textarea
                                                            class="form-control form-control-sm"
                                                            id="detail-medical-medications"
                                                            rows="2"
                                                            readonly
                                                        ></textarea>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <!-- Subscription -->
                                        <div class="col-lg-6 mb-4">
                                            <div class="card">
                                                <div class="card-header">
                                                    <h6 class="mb-0">Subscription</h6>
                                                </div>
                                                <div class="card-body">
                                                    <div class="row">
                                                        <div class="col-md-12 mb-3">
                                                            <label class="form-label small text-muted">Payment Status</label>
                                                            <input class="form-control form-control-sm" id="detail-subscription-status" readonly>
                                                        </div>
                                                        <div class="col-md-12 mb-3">
                                                            <label class="form-label small text-muted">Expiry Date</label>
                                                            <input class="form-control form-control-sm" id="detail-subscription-expiry" readonly>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- Contact Info -->
                                        <div class="col-lg-6 mb-4">
                                            <div class="card">
                                                <div class="card-header">
                                                    <h6 class="mb-0">Contact Info</h6>
                                                </div>
                                                <div class="card-body">
                                                    <div class="row">
                                                        <div class="col-md-6 mb-3">
                                                            <label class="form-label small text-muted">Emergency Contact 1 Name</label>
                                                            <input class="form-control form-control-sm" id="detail-ec1-name" readonly>
                                                        </div>
                                                        <div class="col-md-6 mb-3">
                                                            <label class="form-label small text-muted">Emergency Contact 1 Number</label>
                                                            <input class="form-control form-control-sm" id="detail-ec1-phone" readonly>
                                                        </div>
                                                        <div class="col-md-6 mb-3">
                                                            <label class="form-label small text-muted">Emergency Contact 2 Name</label>
                                                            <input class="form-control form-control-sm" id="detail-ec2-name" readonly>
                                                        </div>
                                                        <div class="col-md-6 mb-3">
                                                            <label class="form-label small text-muted">Emergency Contact 2 Number</label>
                                                            <input class="form-control form-control-sm" id="detail-ec2-phone" readonly>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card mb-4">
                                        <div class="card-header">
                                            <h6 class="mb-0">Media Attachments</h6>
                                        </div>
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col-md-4 mb-3">
                                                    <label class="form-label small text-muted">Image</label>
                                                    <div class="border rounded p-2 text-body-secondary" id="detail-media-image"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card">
                                        <div class="card-header d-flex align-items-center justify-content-between">
                                            <h6 class="mb-0">Report Status Timeline</h6>
                                            <span class="badge bg-label-secondary" id="detail-status-badge">-</span>
                                        </div>
                                        <div class="card-body">
                                            <div class="ps-1">
                                                <div class="d-flex align-items-start">
                                                    <div class="d-flex flex-column align-items-center me-3">
                                                        <div id="sdot-received" style="width:28px;height:28px;font-size:11px;flex-shrink:0;background:#f0f0f0;color:#adb5bd;border:2px solid #dee2e6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;">1</div>
                                                        <div id="sline-received" style="width:2px;height:28px;background:#dee2e6;"></div>
                                                    </div>
                                                    <div class="pt-1 pb-3">
                                                        <div class="fw-semibold small">Received</div>
                                                        <div class="text-muted" style="font-size:0.75rem;" id="stime-received">-</div>
                                                    </div>
                                                </div>
                                                <div class="d-flex align-items-start">
                                                    <div class="d-flex flex-column align-items-center me-3">
                                                        <div id="sdot-assigned" style="width:28px;height:28px;font-size:11px;flex-shrink:0;background:#f0f0f0;color:#adb5bd;border:2px solid #dee2e6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;">2</div>
                                                        <div id="sline-assigned" style="width:2px;height:28px;background:#dee2e6;"></div>
                                                    </div>
                                                    <div class="pt-1 pb-3">
                                                        <div class="fw-semibold small">Assigned</div>
                                                        <div class="text-muted" style="font-size:0.75rem;" id="stime-assigned">-</div>
                                                    </div>
                                                </div>
                                                <div class="d-flex align-items-start">
                                                    <div class="d-flex flex-column align-items-center me-3">
                                                        <div id="sdot-inprogress" style="width:28px;height:28px;font-size:11px;flex-shrink:0;background:#f0f0f0;color:#adb5bd;border:2px solid #dee2e6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;">3</div>
                                                        <div id="sline-inprogress" style="width:2px;height:28px;background:#dee2e6;"></div>
                                                    </div>
                                                    <div class="pt-1 pb-3">
                                                        <div class="fw-semibold small">In Progress</div>
                                                        <div class="text-muted" style="font-size:0.75rem;" id="stime-inprogress">-</div>
                                                    </div>
                                                </div>
                                                <div class="d-flex align-items-start">
                                                    <div class="d-flex flex-column align-items-center me-3">
                                                        <div id="sdot-completed" style="width:28px;height:28px;font-size:11px;flex-shrink:0;background:#f0f0f0;color:#adb5bd;border:2px solid #dee2e6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;">4</div>
                                                    </div>
                                                    <div class="pt-1">
                                                        <div class="fw-semibold small">Completed</div>
                                                        <div class="text-muted" style="font-size:0.75rem;" id="stime-completed">-</div>
                                                    </div>
                                                </div>
                                            </div>
                                            <hr class="my-3">
                                            <p class="text-body-secondary small mb-2">Change status:</p>
                                            <div class="d-flex gap-2 flex-wrap">
                                                <button class="btn btn-sm btn-outline-info" id="status-btn-assigned" onclick="setReportStatus('Assigned')">Assigned</button>
                                                <button class="btn btn-sm btn-outline-warning" id="status-btn-inprogress" onclick="setReportStatus('In Progress')">In Process</button>
                                                <button class="btn btn-sm btn-outline-success" id="status-btn-completed" onclick="setReportStatus('Completed')">Complete</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <script src="assets/vendor/js/bootstrap.js"></script>
            <script src="js/utils.js"></script>
            <script src="js/data.js"></script>
            <script src="js/report-details.js"></script>
            <script>
      const reportId = new URLSearchParams(window.location.search).get('reportId');
      if (reportId) {
        renderReportDetailsPage(reportId);
      }
            </script>
        </body>
    </html>
